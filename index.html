<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Analytics Demo</title>
</head>
<body>
    <h1>Welcome to the site!</h1>
    <p>Standard access logging is running in the background.</p>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // TODO: Replace with your Firebase project configuration
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function logVisitor() {
            try {
                // 1. Fetch the user's IP address
                const ipResponse = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipResponse.json();
                const userIp = ipData.ip;

                // 2. Write the IP and metadata to Firestore
                await addDoc(collection(db, "visitor_logs"), {
                    ip_address: userIp,
                    user_agent: navigator.userAgent,
                    timestamp: serverTimestamp(),
                    page_url: window.location.href
                });

                console.log("Analytics logged successfully.");
            } catch (error) {
                console.error("Error logging visitor:", error);
            }
        }

        // Execute the function when the page loads
        window.onload = logVisitor;
    </script>
</body>
</html>
